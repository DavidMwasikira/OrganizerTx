<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrganizerTX</title>
<meta name="description" content="Research any topic, keep the documents in a project folder, and get regular one-page updates.">
<meta name="theme-color" content="#0A6B7A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet register. One column of work, a rail of four places,
   and every saved document carries a drawing-office style reference number. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --sunk:#E6EBEF; --ink:#10212E; --muted:#566878; --line:#D3DBE2;
  --accent:#0A6B7A; --accent-ink:#FFFFFF; --accent-soft:#DDEEF0; --signal:#B86A00; --signal-soft:#FBEBD2; --bad:#B3261E;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B141A; --surface:#132029; --sunk:#0F1A21; --ink:#E4ECF1; --muted:#8FA2B0; --line:#25343F;
    --accent:#3FB6C6; --accent-ink:#06222A; --accent-soft:#12333B; --signal:#F0B04A; --signal-soft:#3A2B10; --bad:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B141A; --surface:#132029; --sunk:#0F1A21; --ink:#E4ECF1; --muted:#8FA2B0; --line:#25343F;
  --accent:#3FB6C6; --accent-ink:#06222A; --accent-soft:#12333B; --signal:#F0B04A; --signal-soft:#3A2B10; --bad:#FF8A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:.8rem;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:.875rem}

#app{display:flex;height:100%}
nav{display:flex;flex-direction:column;gap:4px;width:208px;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);flex:none}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;padding:0 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--signal);display:inline-block}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px;border-radius:9px;text-align:left;color:var(--muted);font-weight:500}
nav button svg{width:20px;height:20px;flex:none}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav button .dot{margin-left:auto}
main{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column}
.page{width:100%;max-width:820px;margin:0;padding:28px 28px 40px;display:flex;flex-direction:column;gap:22px}
.page.fill{flex:1;min-height:0;padding-bottom:0}
@media (max-width:760px){
  nav button{padding-left:6px!important;padding-right:6px!important}
  #app{flex-direction:column-reverse}
  nav{flex-direction:row;width:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);justify-content:space-around}
  .brand{display:none}
  nav button{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 12px;position:relative}
  nav button .dot{position:absolute;top:4px;right:10px;margin:0}
  .page{padding:18px 16px 28px}
}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;font-weight:500;min-height:42px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=email],textarea,select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;width:100%;min-height:42px}
textarea{resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.9rem;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;min-height:40px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill.due{background:var(--signal-soft);color:var(--signal)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--signal);display:inline-block;flex:none}

.ask{display:flex;flex-direction:column;gap:12px;padding:18px}
.ask textarea{border:0;padding:0;font-size:1.1rem;min-height:88px;background:none;outline:none}
.ask .row{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.banner{border-left:4px solid var(--signal);background:var(--signal-soft);border-radius:8px;padding:10px 14px;font-size:.92rem}

.thead{display:flex;flex-direction:column;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:18px}
.tabs button{border:0;background:none;padding:6px 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.thread{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px 0}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{align-self:flex-start;color:var(--bad);border:1px solid var(--bad);background:none}
.doccard{align-self:stretch;border-left:4px solid var(--accent)}
.doccard.U{border-left-color:var(--signal)}
.doccard header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 14px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px}
.working{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.9rem}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md h1{font-size:1.3rem;margin:.2em 0 .5em}.md h2{font-size:1.08rem;margin:1.1em 0 .4em}.md h3,.md h4{font-size:1rem;margin:1em 0 .3em}
.md p{margin:.5em 0}.md ul,.md ol{margin:.5em 0;padding-left:1.3em}.md li{margin:.25em 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.md blockquote{margin:.6em 0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.tw{overflow-x:auto}
.md pre{overflow-x:auto;background:var(--sunk);padding:10px 12px;border-radius:8px;font-size:.85rem}
.md figure{margin:1em 0}
.md figure.mm{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;text-align:center}
.md figure.mm svg{max-width:100%;height:auto}
.mmph{color:var(--muted);font-size:.9rem;padding:10px 0}
.md figure.ph img{max-width:100%;max-height:420px;border-radius:8px;display:block;background:var(--sunk)}
.md figcaption{font-size:.88rem;margin-top:6px}
.md table{border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--sunk)}

.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pct{font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.item .num{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--accent);width:2ch;text-align:center;flex:none;align-self:flex-start}
.b{display:block}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.85rem}
.facts span b{display:block;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gantt{display:grid;grid-template-columns:minmax(92px,34%) 1fr;gap:6px 10px;align-items:center;font-size:.84rem}
.gantt .gn{line-height:1.25;overflow-wrap:anywhere}
.gantt .tr{position:relative;height:20px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--sunk) 0,var(--sunk) calc(var(--wk) - 1px),var(--line) calc(var(--wk) - 1px),var(--line) var(--wk))}
.gantt .tr i{position:absolute;top:3px;bottom:3px;border-radius:3px;background:var(--accent-soft);border:1.5px solid var(--accent)}
.gantt .tr i.done{background:var(--accent)}
.gantt .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--signal)}
.gantt .sc{position:relative;height:16px;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.gantt .sc span{position:absolute;top:0}
.act{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px}
.act:first-child{border-top:0}
.act .box{width:22px;height:22px;border:2px solid var(--accent);border-radius:6px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-size:.8rem;font-weight:700}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto}
.sheetbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:1}
.sheet{max-width:780px;margin:24px auto 60px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:clamp(20px,5vw,56px)}
.sheet h1{font-size:clamp(1.5rem,4vw,2rem);margin:18px 0 22px}
.titleblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--ink)}
.titleblock div{padding:8px 10px;border:.5px solid var(--ink);display:flex;flex-direction:column;gap:2px}
.titleblock span{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.titleblock b{font-family:var(--mono);font-weight:500;font-size:.85rem;overflow-wrap:anywhere}
.sheet .md{max-width:66ch}
.sources{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:.9rem}
.sources ol{padding-left:1.3em}.sources li{margin:.3em 0;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:50;font-size:.9rem;max-width:90vw}
/* --- icon rail, home, board --- */
:root{--rail:#0B3A44;--rail-ink:#CFE3E7}
nav{width:92px;padding:14px 8px;background:var(--rail);border-right:0;gap:2px;overflow-y:auto}
.brand{display:none}
nav button{flex-direction:column;gap:4px;font-size:.74rem;font-weight:600;padding:9px 2px;color:var(--rail-ink);text-align:center;position:relative}
nav button[aria-current="page"]{background:rgba(255,255,255,.15);color:#fff}
nav button .dot{position:absolute;top:6px;right:20px;margin:0}
nav .create{margin-bottom:8px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.2);border-radius:9px 9px 0 0;color:#fff}
nav .create i{width:40px;height:40px;border-radius:50%;background:var(--create,#F0B04A);color:var(--create-ink,#231700);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1.6rem;line-height:1}
nav .sp{flex:1}
.only-narrow{display:none}
:root{--glow:rgba(10,107,122,.20)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glow:rgba(63,182,198,.28)}}
:root[data-theme="dark"]{--glow:rgba(63,182,198,.28)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scard{display:flex;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--accent-soft);border-radius:10px;padding:12px 14px;min-height:64px;font-size:.92rem;line-height:1.35;box-shadow:0 0 0 1px var(--accent-soft),0 4px 18px var(--glow);transition:box-shadow .15s}
.scard:hover{box-shadow:0 0 0 1px var(--accent),0 6px 24px var(--glow)}
@media (prefers-reduced-motion:reduce){.scard{transition:none}}
.objbox{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:6px 12px 10px}
.objbox label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:.93rem;cursor:pointer}
.objbox label:first-of-type{border-top:0}
.objbox input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent)}
.ask textarea{max-height:300px}
.fold{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0}
.fold svg{width:16px;height:16px;transition:transform .15s}
.fold[aria-expanded="false"] svg{transform:rotate(-90deg)}
.wk{list-style:none;margin:12px 0 0;padding:4px 2px 12px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin}
.wk li{flex:0 0 min(310px,84%);scroll-snap-align:start}
.wknav{width:38px;min-height:38px;padding:0;font-size:1.2rem}
.wk button{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.wk .num{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--accent);width:2ch;text-align:center;flex:none}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--create,#F0B04A);color:var(--create-ink,#231700);font-size:1.8rem;line-height:1;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5}
.page.wide{max-width:none}
.hello{font-size:clamp(1.6rem,4vw,2.2rem)}
.hello em{font-style:normal;color:var(--accent)}
.hgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,2fr);gap:18px;align-items:start}
.hside{display:flex;flex-direction:column;gap:14px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.qcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.qcard .ic{width:36px;height:36px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.qcard .ic svg{width:20px;height:20px}
.qcard.T .ic{background:var(--signal-soft);color:var(--signal)}
.trow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.box{width:22px;height:22px;border:2px solid var(--accent);border-radius:6px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-size:.8rem;font-weight:700;background:none;padding:0}
.box[aria-checked="true"]{background:var(--accent)}
.linkish{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.board{display:grid;grid-template-columns:repeat(4,minmax(232px,1fr));gap:14px;overflow-x:auto;align-items:start;padding-bottom:8px}
.lane{display:flex;flex-direction:column;gap:10px;min-height:160px;border-radius:10px;padding:4px}
.lane.over{background:var(--accent-soft)}
.lane header{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-weight:700;font-family:var(--display)}
.lane header i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px;background:var(--muted)}
.lane[data-lane="doing"] header i{background:var(--accent)}.lane[data-lane="blocked"] header i{background:var(--bad)}.lane[data-lane="done"] header i{background:#2E8B57}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;display:flex;flex-direction:column;gap:4px}
.kcard .tag{font-size:.74rem;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.kcard .t{font-weight:600;overflow-wrap:anywhere}
.kcard[data-s="doing"]{border-left-color:var(--accent)}.kcard[data-s="blocked"]{border-left-color:var(--bad)}.kcard[data-s="done"]{border-left-color:#2E8B57}
.kcard[data-s="done"] .t{color:var(--muted)}
table.tl{width:100%;border-collapse:collapse;background:var(--surface);font-size:.94rem}
table.tl th,table.tl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
table.tl th{background:var(--sunk);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.act{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:12px 2px;background:none;border-left:0;border-right:0;border-bottom:0}
.act.done .t{text-decoration:line-through;color:var(--muted)}
.modal .card.wide{max-width:520px}
.menu3{display:flex;flex-direction:column;gap:8px}
.menu3 button{text-align:left;justify-content:flex-start;padding:12px 14px;height:auto}
@media (max-width:760px){
  nav{width:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;overflow:visible}
  nav .create,nav .sp,nav .only-wide{display:none}
  nav button{padding:6px 2px!important;font-size:.64rem;flex:1;min-width:0}
  nav button .dot{right:26%}
  .only-narrow{display:inline-flex}
  .hgrid{grid-template-columns:1fr}
}
.docpage{padding-top:0}
.docpage .sheetbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2;max-width:780px;width:100%;margin:0}
.docpage .sheet{margin:18px 0 40px;width:100%}
.md figure.mm svg{max-width:none}
nav .util{display:flex;gap:4px;justify-content:center}
nav .util button{flex:1;padding:8px 0}
nav .util svg{width:18px;height:18px}

<script>
"use strict";
const VERSION='v0.37';
/* ---------- small helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOUR=3600e3, DAY=24*HOUR;
const fmtDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fmtShort=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const ymd=t=>{const d=new Date(t);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
const hosted=()=>!(window.claude&&window.claude.use);   // false when running as a preview inside Claude
let SERVER='';                                            // set in config.js: the owner's server that holds the key and checks access codes
const cred=()=>SERVER?S.code:S.key;
const credName=()=>SERVER?'access code':'Claude API key';

function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
  return s;
}
function md(src,live){
  const L=String(src||'').replace(/\r/g,'').split('\n'),out=[];let i=0,m;
  const isList=l=>/^\s*([-*•]|\d+[.)])\s+/.test(l), isRow=l=>/^\s*\|.*\|\s*$/.test(l);
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    if(m=l.match(/^\s*```\s*(\w*)/)){
      const b=[];let closed=false;i++;
      while(i<L.length){if(/^\s*```/.test(L[i])){closed=true;i++;break}b.push(L[i]);i++}
      if(m[1].toLowerCase()==='mermaid')out.push(closed&&!live?`<figure class="mm" data-code="${esc(b.join('\n'))}"><div class="mmph">Drawing diagram...</div></figure>`:'<div class="mmph">Drawing diagram...</div>');
      else out.push(`<pre><code>${esc(b.join('\n'))}</code></pre>`);
      continue;
    }
    if(m=l.match(/^\s*\[\[IMAGE:\s*([^|\]]+)\|?\s*([^\]]*)\]\]\s*$/i)){
      out.push(live?'<div class="mmph">Finding a photo...</div>':`<figure class="ph" data-q="${esc(m[1].trim())}" data-cap="${esc(m[2].trim())}"><div class="mmph">Finding a photo...</div></figure>`);i++;continue;
    }
    if(m=l.match(/^(#{1,4})\s+(.*)/)){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(isRow(l)&&i+1<L.length&&/^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const h=row(l),rows=[];i+=2;
      while(i<L.length&&isRow(L[i])){rows.push(row(L[i]));i++}
      out.push(`<div class="tw"><table><thead><tr>${h.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue;
    }
    if(isList(l)){
      const ord=/^\s*\d+[.)]\s+/.test(l),items=[];
      while(i<L.length&&isList(L[i])){
        items.push(L[i].replace(/^\s*([-*•]|\d+[.)])\s+/,''));i++;
        while(i<L.length&&/^\s{2,}\S/.test(L[i])&&!isList(L[i])){items[items.length-1]+=' '+L[i].trim();i++}
      }
      const tag=ord?'ol':'ul';out.push(`<${tag}>${items.map(x=>`<li>${inline(x)}</li>`).join('')}</${tag}>`);continue;
    }
    if(/^>\s?/.test(l)){const b=[];while(i<L.length&&/^>\s?/.test(L[i])){b.push(L[i].replace(/^>\s?/,''));i++}out.push(`<blockquote>${inline(b.join(' '))}</blockquote>`);continue}
    const p=[];
    while(i<L.length&&L[i].trim()&&!/^#{1,4}\s/.test(L[i])&&!isList(L[i])&&!/^>/.test(L[i])&&!isRow(L[i])&&!/^\s*(```|\[\[IMAGE:)/i.test(L[i])){p.push(L[i]);i++}
    if(!p.length){p.push(L[i]);i++}
    out.push(`<p>${inline(p.join(' '))}</p>`);
  }
  return out.join('');
}

/* ---------- visuals: diagrams drawn from Mermaid text, photos looked up on Wikimedia Commons ---------- */
const mmDone=new Map(),mmJobs=new Map(),imgJobs=new Map();let mmLoad=null,mmQ=Promise.resolve(),mmN=0;
function loadMermaid(){
  return mmLoad||(mmLoad=new Promise((ok,no)=>{
    const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
    sc.onload=()=>{try{mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'neutral',htmlLabels:false,flowchart:{htmlLabels:false,useMaxWidth:false}});ok()}catch(e){no(e)}};
    sc.onerror=()=>{mmLoad=null;no(new Error('offline'))};document.head.appendChild(sc);
  }));
}
function diagram(code){
  if(!mmJobs.has(code))mmJobs.set(code,(async()=>{
    let svg=null;
    try{
      await loadMermaid();
      svg=await (mmQ=mmQ.catch(()=>{}).then(async()=>{await mermaid.parse(code);return (await mermaid.render('fmm'+(++mmN),code)).svg}));
    }catch(e){document.querySelectorAll('[id^="dfmm"]').forEach(x=>x.remove());if(e&&e.message==='offline'){mmJobs.delete(code);return undefined}}
    mmDone.set(code,svg);return svg;
  })());
  return mmJobs.get(code);
}
function photo(q){
  if(q in S.img)return Promise.resolve(S.img[q]);
  if(!hosted())return Promise.resolve(undefined);
  if(!imgJobs.has(q))imgJobs.set(q,(async()=>{
    try{

      const j=await (await fetch(u)).json();

function toPng(svg){
  return new Promise((ok,no)=>{
    const m=svg.match(/viewBox="([-\d.\s]+)"/),v=m?m[1].trim().split(/\s+/).map(Number):[0,0,800,500],w=v[2]||800,h=v[3]||500;
    const sized=svg.replace(/<svg([^>]*)>/,(all,a)=>`<svg${a.replace(/\s(width|height)="[^"]*"/g,'')} width="${w}" height="${h}">`);
    const img=new Image();
    img.onload=()=>{try{const k=Math.min(2,1800/w),c=document.createElement('canvas');c.width=w*k;c.height=h*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);ok({src:c.toDataURL('image/png'),w:Math.round(Math.min(600,w)),h:Math.round(Math.min(600,w)*h/w)})}catch(e){no(e)}};
    img.onerror=no;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sized);
  });
}

async function richHtml(src,asPng){

    if(!asPng){el.innerHTML=svg;continue}
    const pic=await toPng(svg).catch(()=>null);
    el.outerHTML=pic?`<p align="center"><img src="${pic.src}" width="${pic.w}" height="${pic.h}"></p>`:'<p><i>[Diagram: open this document in OrganizerTX to see it]</i></p>';
  }

    if(p)el.outerHTML=`<p><img src="${esc(p.src)}" width="520"><br><i>${esc(el.dataset.cap)}. ${credit(p)}</i></p>`;else el.remove();

  return box.innerHTML;
}

/* ---------- storage: one JSON document in IndexedDB, falling back to localStorage, then memory ---------- */
const store={
  db:null,
  async open(){
    try{
      this.db=await new Promise((ok,no)=>{const r=indexedDB.open('fuatilia',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
    }catch(e){this.db=null}
  },
  async get(){
    if(this.db){try{const v=await new Promise((ok,no)=>{const r=this.db.transaction('kv').objectStore('kv').get('state');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});if(v)return v}catch(e){}}
    try{const v=localStorage.getItem('fuatilia');if(v)return JSON.parse(v)}catch(e){}
    return null;
  },
  set(v){
    if(this.db){try{this.db.transaction('kv','readwrite').objectStore('kv').put(v,'state');return}catch(e){}}
    try{localStorage.setItem('fuatilia',JSON.stringify(v))}catch(e){}
  }
};
store.key=function(k,v){
  if(!this.db)return Promise.resolve(undefined);
  return new Promise(ok=>{try{const os=this.db.transaction('kv',v===undefined?'readonly':'readwrite').objectStore('kv');const r=v===undefined?os.get(k):v===null?os.delete(k):os.put(v,k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(undefined)}catch(e){ok(undefined)}});
};

async function readStream(res,acc,onChange){
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='',stop=null;const base=acc.length,json={};
  for(;;){
    const {done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let nl;
    while((nl=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
      if(!line.startsWith('data:'))continue;
      let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
      if(ev.type==='content_block_start'){acc[base+ev.index]=JSON.parse(JSON.stringify(ev.content_block));json[ev.index]='';onChange()}
      else if(ev.type==='content_block_delta'){
        const b=acc[base+ev.index],d=ev.delta;if(!b)continue;
        if(d.type==='text_delta'){b.text=(b.text||'')+d.text;onChange()}
        else if(d.type==='input_json_delta')json[ev.index]+=d.partial_json;
        else if(d.type==='citations_delta')(b.citations=b.citations||[]).push(d.citation);
        else if(d.type==='thinking_delta')b.thinking=(b.thinking||'')+d.thinking;
        else if(d.type==='signature_delta')b.signature=d.signature;
      }
      else if(ev.type==='content_block_stop'){const b=acc[base+ev.index];if(b&&b.type==='server_tool_use'){try{b.input=JSON.parse(json[ev.index]||'{}')}catch(e){b.input={}}onChange()}}
      else if(ev.type==='message_delta'){if(ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason}
      else if(ev.type==='error')throw new Error(ev.error&&ev.error.message||'The AI service reported an error.');
    }
  }
  return stop;
}
/* callAI: one entry point for both ways of running.
   Hosted: the user's own key, sent straight to api.anthropic.com, with live web search.
   Preview inside Claude: the page asks Claude directly, without web search. */
async function callAI({system,messages,depth='moderate',search=0,maxTokens,onText,onStatus,signal}){
  const D=DEPTHS[depth];
  if(!hosted()){
    const sample=await window.claude.use('sample');
    if(!sample)throw new Error('Claude is not available in this view. Open the page on claude.ai and try again.');
    const msgs=messages.map(m=>({role:m.role,content:m.content}));
    msgs[0]={role:'user',content:system+'\n\n-----\n\n'+msgs[0].content};
    try{
      const r=await sample(msgs,{onText:({text})=>onText&&onText(text),signal,modelTier:D.tier,cache:false});
      aiUsed=true;return {text:r.text,sources:[]};
    }catch(e){
      if(signal&&signal.aborted){const a=new Error('Stopped');a.name='AbortError';throw a}
      if(e&&e.code==='rate_limited')throw new Error('Too many requests just now. Wait a minute and try again.');
      if(e&&e.code==='not_granted')throw new Error('Permission to ask Claude was not given, so nothing was run.');
      throw new Error(e&&e.message||'Claude could not answer.');
    }
  }
  if(!cred())throw new Error('Add your '+credName()+' in Settings first.');
  const acc=[];let stop=null,lean=depth==='helper';
  const visible=()=>{let last=-1;acc.forEach((b,i)=>{if(b&&b.type==='web_search_tool_result')last=i});return acc.slice(last+1).filter(b=>b&&b.type==='text').map(b=>b.text).join('')};
  const change=()=>{
    const b=acc[acc.length-1];
    if(b&&b.type==='server_tool_use'&&onStatus)onStatus(b.input&&b.input.query?'Searching: '+b.input.query:'Searching the web');
    onText&&onText(visible());
  };
  for(let turn=0;turn<8;turn++){
    const body={model:S.models[depth]||S.models.moderate,max_tokens:maxTokens||D.max,system,stream:true,
      messages:acc.length?[...messages,{role:'assistant',content:acc.filter(b=>b&&!(b.type==='text'&&!b.text))}]:messages};
    if(search)body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:search}];
    if(lean){body.thinking={type:'disabled'};body.output_config={effort:'low'}}
    let res;
    try{res=await fetch(SERVER?SERVER.replace(/\/+$/,'')+'/v1/messages':'https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:SERVER?{'content-type':'application/json','x-slot':S.code}:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}
    catch(e){if(e.name==='AbortError')throw e;throw new Error('Could not reach the AI service. Check your internet connection and try again.')}
    if(!res.ok){
      let msg='';try{msg=(await res.json()).error.message}catch(e){}
      if(res.status===400&&lean){lean=false;continue}        // this model would not take the lean settings: ask again without them
      if(res.status===401)throw new Error(SERVER?(msg||'That access code was not recognised. Check it in Settings.'):'The API key was rejected. Check it in Settings.');
      if(res.status===429)throw new Error(SERVER&&msg?msg:'The AI service is busy or your usage limit was reached. Try again in a minute.');
      throw new Error(msg||('The AI service returned error '+res.status+'.'));
    }
    stop=await readStream(res,acc,change);
    if(stop!=='pause_turn')break;
  }
  const seen=new Map();
  acc.forEach(b=>{if(b&&b.type==='text')(b.citations||[]).forEach(c=>{if(c.url&&!seen.has(c.url))seen.set(c.url,c.title||c.url)})});
  aiUsed=true;
  if(!visible().trim()){
    if(stop==='max_tokens')throw new Error('The AI used up its allowance thinking before it wrote anything. Try again, or shorten the request.');
    if(stop==='refusal')throw new Error('The AI declined this request. Try wording it differently.');
    throw new Error('The AI returned no text (it stopped with "'+(stop||'no reason given')+'"). Try again.');
  }
  return {text:visible(),sources:[...seen].map(([url,title])=>({url,title}))};
}

const REPEAT={'':'Does not repeat',daily:'Every day',weekdays:'Every weekday',weekly:'Every week',monthly:'Every month'};
const localISO=t=>{const d=new Date(t),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())};
function nextDate(d,rep){const x=new Date((isoOk(d)||dash(Date.now()))+'T12:00');if(rep==='daily')x.setDate(x.getDate()+1);else if(rep==='weekdays'){do{x.setDate(x.getDate()+1)}while([0,6].includes(x.getDay()))}else if(rep==='monthly')x.setMonth(x.getMonth()+1);else x.setDate(x.getDate()+7);return dash(x.getTime())}
/* when a repeating task is completed (by any route), the next one is created once */
function sweepRecurring(){
  let made=null;const today=dash(Date.now());
  S.plans.forEach(p=>p.acts.slice().forEach(a=>{if(!a.repeat||!REPEAT[a.repeat]||!isDone(a)||a.spawned)return;a.spawned=true;
    let due=nextDate(a.due,a.repeat),guard=0;while(due<=today&&guard++<400)due=nextDate(due,a.repeat);
    const shift=a.remind&&a.due?new Date(a.remind).getTime()-new Date(a.due+'T00:00').getTime():null;
    made={name:a.name,detail:a.detail||'',owner:a.owner||'',status:'todo',due,repeat:a.repeat,remind:shift!==null&&isFinite(shift)?localISO(new Date(due+'T00:00').getTime()+shift):''};p.acts.push(made)}));
  if(made){save();setTimeout(()=>toast('Repeating task: the next "'+clip(made.name,40)+'" is set for '+fmtShort(made.due)+'.'),50)}
}
async function notifyNow(title,body,tag){if(!('Notification' in window)||Notification.permission!=='granted')return;try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)reg.showNotification(title,{body,icon:'icon-192.png',tag});else new Notification(title,{body})}catch(e){}}

/* ---------- My Day briefing ----------
   The facts (due, overdue, blocked, what changed) are worked out on this device, so they are always exact and
   always current. The AI is given only those facts and asked to word a short summary and rank three priorities;
   every priority it returns must point at a real task or folder, otherwise the app's own ranking is used. */
function dayFacts(){
  const today=dash(Date.now()),soonTo=dash(Date.now()+3*DAY),open=allTasks().filter(x=>!isDone(x.a));
  const row=x=>({id:x.id,name:x.a.name,project:x.p.name,due:x.due||'',status:x.a.status});
  const changed=S.topics.filter(t=>t.interval&&t.docs.length).map(t=>({t,d:t.docs[t.docs.length-1]})).filter(({t,d})=>t.unread||(d.type==='U'&&Date.now()-d.date<36*3600e3))
    .sort((a,b)=>b.d.date-a.d.date).map(({t,d})=>({id:t.id,title:t.title,update:d.title,date:d.date,unread:!!t.unread,gist:String(d.md||'').replace(/```[\s\S]*?```/g,' ').replace(/[#*_>|\[\]]/g,' ').replace(/\s+/g,' ').trim().slice(0,320)}));
  return {today,overdue:open.filter(x=>x.due&&x.due<today).sort((a,b)=>a.due<b.due?-1:1).map(row),dueToday:open.filter(x=>x.due===today).map(row),
    blocked:open.filter(x=>x.a.status==='blocked').map(row),doing:open.filter(x=>x.a.status==='doing').map(row),
    soon:open.filter(x=>x.due&&x.due>today&&x.due<=soonTo).sort((a,b)=>a.due<b.due?-1:1).map(row),changed,openCount:open.length};
}
const dayEmpty=f=>!(f.overdue.length||f.dueToday.length||f.blocked.length||f.doing.length||f.soon.length||f.changed.length);

function dayRank(f){
  const out=[],seen=new Set(),add=(kind,id,title,why)=>{const k=kind+id;if(!seen.has(k)&&out.length<3){seen.add(k);out.push({kind,id,title,why})}};
  f.overdue.forEach(x=>add('task',x.id,x.name,'Overdue since '+fmtShort(x.due)+' ('+x.project+').'));
  f.dueToday.forEach(x=>add('task',x.id,x.name,'Due today ('+x.project+').'));
  f.blocked.forEach(x=>add('task',x.id,x.name,'Blocked: clear what is stopping it, or reschedule.'));
  f.changed.filter(c=>c.unread).forEach(c=>add('topic',c.id,c.title,'New update to read: '+c.update+'.'));
  f.soon.forEach(x=>add('task',x.id,x.name,'Due '+fmtShort(x.due)+' ('+x.project+').'));
  f.doing.forEach(x=>add('task',x.id,x.name,'Already in progress: finish it.'));

const OBJ_RE=/\n*Objectives:\n(?:- .*(?:\n|$))*\s*$/;
const askBase=()=>V.ask.replace(OBJ_RE,'').trim();
function applyObjectives(){
  const picked=V.objSel.map(i=>V.objList[i]).filter(Boolean);
  V.ask=askBase()+(picked.length?'\n\nObjectives:\n'+picked.map(x=>'- '+x).join('\n'):'');
}
function needKey(){if(hosted()&&!cred()){toast('Add your '+credName()+' in Settings first.');return true}return false}
function suggestObjectives(){
  const base=askBase();if(!base){toast('Type your topic first, then ask for objectives.');return}
  if(needKey())return;
  job('objs','Suggesting objectives',async signal=>{
    const r=await callAI({system:systemPrompt(),depth:'helper',maxTokens:3000,signal,messages:[{role:'user',content:
`The user wants to research this: "${base}"
Suggest 8 specific objectives they could add so the research answers what matters, fitted to this topic and to ${place()}. Cover different angles, for example costs and funding, suppliers or tools, step-by-step plan, risks, rules and licences, the market and competitors, returns, and a timeline. Each objective starts with a verb and has at most 12 words.
Reply with only a JSON array of 8 strings.`}]});
    let a=grab(r.text,'[',']');
    if(!Array.isArray(a))a=r.text.split('\n').map(l=>l.replace(/^\s*(?:\d+[.)]|[-*•])\s*/,'').replace(/^"|",?$/g,'').trim()).filter(l=>l.length>8);
    a=a.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim().replace(/\.$/,'')).slice(0,8);
    if(!a.length)throw new Error('No objectives came back. Try again.');
    V.ask=askBase();V.objList=a;V.objSel=[];V.objOpen=true;
  });
}
function refinePrompt(){
  const cur=V.ask.trim();if(!cur){toast('Type your topic first, then refine it.');return}
  if(needKey())return;
  job('refine','Refining your prompt',async signal=>{
    const r=await callAI({system:systemPrompt(),depth:'helper',maxTokens:3000,signal,messages:[{role:'user',content:
`Rewrite the research request below into a clear, specific brief that a researcher could act on. Keep the user's intent and every objective they listed. Add the specifics that are safe to take from the user's profile (their country and field), say what is in scope, and say what output is wanted. Use at most 90 words: one short paragraph, then the objectives as a short dashed list if there are any. Do not answer the request. Reply with only the rewritten request.

Request:
${cur}`}]});
    const out=r.text.trim().replace(/^["']|["']$/g,'');
    if(!out)throw new Error('The refined prompt came back empty. Try again.');
    V.askPrev=cur;V.ask=out;V.objList=[];V.objSel=[];V.objOpen=false;
  });
}
function ideas(){
  if(S.ideas.length)return S.ideas;
  const areas=S.profile.areas.length?S.profile.areas:Object.keys(AREAS).slice(0,4),out=[];
  for(let k=0;k<2&&out.length<6;k++)areas.forEach(a=>{if(AREAS[a]&&out.length<6)out.push(AREAS[a][k])});

}

/* ---------- scheduler: runs whenever the app is open, and catches up when it is reopened ---------- */
function tick(){
  if(!S.profile.setup||busy)return;
  if(briefDue()&&(dayEmpty(dayFacts())||(hosted()&&!cred()))){makeBrief(false);return}
  if(hosted()&&!cred())return;
  const first=!S.weekly&&Date.now()-(S.weeklyTry||0)>30*60e3;
  if(!hosted()&&!aiUsed){if(first)loadWeekly();return}
  const due=S.topics.filter(t=>t.interval&&t.nextDue&&t.nextDue<=Date.now()).sort((a,b)=>a.nextDue-b.nextDue)[0];
  if(briefDue()){makeBrief(false);return}
  if(due)runUpdate(due,false);
  else if(weeklyDue()&&Date.now()-(S.weeklyTry||0)>30*60e3)loadWeekly();
}

}

function weeklyHtml(){

/* ---------- rules and skills: plain text files the user owns; rules shape every document, a skill shapes one research ---------- */
const LIBSTART={"rules": [{"file": "01-document-structure.md", "text": "# Document structure\n\nHow every report and update is organised.\n\n## Do\n- Open with a title of at most 8 words that names the subject and the place.\n- Put a **Summary** of 3 to 5 bullet points first, so a busy reader can stop there.\n- Follow with sections in this order where they apply: background, how it works, findings, options, costs, risks, recommended next steps.\n- End every report with **Recommended next steps** as a numbered list, most urgent first.\n- Give each section one job, and say the most important thing in its first sentence.\n- State the date of the information and the exchange rate used, once.\n\n## Don't\n- Don't open with an introduction about what the document will cover.\n- Don't repeat the summary in a conclusion.\n- Don't bury a decision or a warning in the middle of a paragraph.\n- Don't add a section that has nothing specific to say.\n"}, {"file": "02-formatting-and-style.md", "text": "# Formatting and style\n\nHow the text itself should read.\n\n## Do\n- Write in plain English, in short sentences, in the active voice.\n- Use the reader's own terms, and define any technical term the first time it appears.\n- Use bullet points for lists of separate items, and numbered lists for steps in order.\n- Start each bullet with a short bold label when the list has more than four items.\n- Give amounts in local currency first, with the US dollar equivalent in brackets.\n- Write numbers with units, and ranges with both ends (for example Kshs 6,000 to 9,500 per metre).\n\n## Don't\n- Don't use filler such as \"it is important to note\" or \"in today's world\".\n- Don't use jargon, slang or abbreviations the reader has not been given.\n- Don't write paragraphs longer than five lines.\n- Don't use capital letters or exclamation marks for emphasis.\n- Don't hedge every sentence; say once how sure the finding is.\n"}, {"file": "03-sources-and-figures.md", "text": "# Sources and figures\n\nHow facts are supported and how doubt is shown.\n\n## Do\n- Name the source of each key fact or figure in the sentence that states it.\n- Prefer official and primary sources: regulators, government gazettes, standards bodies, company filings.\n- Say plainly when a figure is an estimate, and whose estimate it is.\n- Flag anything that could not be verified, and say what would confirm it.\n- When sources disagree, give both figures and say which is more likely to be right, and why.\n- Check the date of every source, and say so when the newest one found is old.\n\n## Don't\n- Don't invent a source, a figure, a name or a link.\n- Don't present a seller's marketing page as an independent fact.\n- Don't round an uncertain figure into a confident one.\n- Don't leave out a risk because it weakens the recommendation.\n"}, {"file": "04-visuals-and-tables.md", "text": "# Visuals and tables\n\nWhen to draw, tabulate or show a photo.\n\n## Do\n- Draw a flow chart whenever a process has three or more steps.\n- Draw a block diagram when a system has parts that feed one another.\n- Put comparisons and figures in a table, with units in the column headings.\n- Keep a diagram to 12 boxes or fewer, with short labels.\n- Write one or two sentences under every diagram, table and photo saying what it shows and why it matters.\n- Use a photo only where seeing the real thing helps the reader recognise or choose it.\n\n## Don't\n- Don't add a diagram that only repeats the headings of the document.\n- Don't put more than six columns in a table.\n- Don't leave a visual without an explanation.\n- Don't use a visual in place of a figure the reader needs in words.\n"}], "skills": [{"dir": "feasibility-study", "text": "---\nname: Feasibility study\ndescription: Tests whether a business or project idea is worth doing in the user's country, with costs, demand, rules and a go or no-go view.\n---\n\n# Feasibility study\n\n## When to use\nThe user has an idea for a business, product or project and wants to know if it can work before spending money.\n\n## Steps\n1. Restate the idea in one sentence: what is sold, to whom, and where.\n2. Size the demand: who buys now, how many, and what they pay. Name the source of each number.\n3. List the competition and what each charges.\n4. Set out the rules: registration, licences, permits and taxes, with the body responsible for each.\n5. Estimate start-up costs and monthly running costs as ranges, in local currency with US dollars in brackets.\n6. Build a simple break-even: price, cost per sale, fixed costs, and the sales needed each month.\n7. List the main risks and one way to reduce each.\n8. Give a clear view: go, go with conditions, or do not go, and the one fact that would change that view.\n\n## Output\n- Summary, then sections in the order of the steps above.\n- One table for costs and one for the break-even.\n- One flow chart from first customer contact to first payment.\n- Recommended next steps for the first 30 days.\n\n## Checks before finishing\n- Every cost has a source or is marked as an estimate.\n- The break-even arithmetic adds up.\n- The view at the end follows from the figures.\n"}, {"dir": "tender-bid-review", "text": "---\nname: Tender and bid review\ndescription: Reads a tender or request for proposals and produces a bid or no-bid brief with requirements, deadlines, risks and a compliance checklist.\n---\n\n# Tender and bid review\n\n## When to use\nThe user is a contractor or consultant deciding whether to bid for a tender, or preparing a bid.\n\n## Steps\n1. Identify the buyer, the reference number, the scope, the estimated value and the closing date and time.\n2. List the mandatory requirements: registration, tax compliance, licences, bid security, experience and key staff.\n3. List the evaluation criteria and the weight of each, where they are published.\n4. Check eligibility: reserved categories, joint venture rules, local content rules.\n5. Set out the timeline from clarification deadline to contract award.\n6. Flag the risks: payment terms, penalties, unclear scope, short deadlines, and anything unusual.\n7. Recommend bid or no-bid, with the three reasons that matter most.\n\n## Output\n- Summary with the closing date in the first bullet.\n- A compliance checklist as a table: requirement, document needed, have it or not.\n- A flow chart of the bid timeline.\n- Recommended next steps with an owner and a date for each.\n\n## Checks before finishing\n- The closing date, time and submission method are stated exactly as published.\n- Nothing is marked as verified unless it came from the tender documents or the buyer.\n- Posts that look fake are flagged: no reference number, a fee to apply, a personal email address.\n"}, {"dir": "job-search-brief", "text": "---\nname: Job search brief\ndescription: Finds current job openings that fit the user's background, weeds out doubtful postings and ranks the rest with what to do for each.\n---\n\n# Job search brief\n\n## When to use\nThe user is looking for work, or wants to know what roles are open for someone with their experience.\n\n## Steps\n1. State the profile being matched: field, years of experience, location, and any limits the user gave.\n2. Search for openings posted in the last 30 days. Record the employer, title, location, closing date and where it was posted.\n3. Check each posting: does the employer exist, is the posting on the employer's own site, and is there any request for money.\n4. Drop or flag doubtful postings, and say why.\n5. Score the rest against the profile: strong match, partial match or stretch.\n6. For each strong match, name the two requirements the user should speak to first.\n\n## Output\n- Summary with the number of openings found and the best three.\n- A table: role, employer, location, closing date, match, source.\n- A short note per strong match on how to apply.\n- Recommended next steps for the coming week.\n\n## Checks before finishing\n- Every opening has a closing date or is marked \"no date given\".\n- No posting that asks for a fee is recommended.\n- Salary figures are given only where a source states them.\n"}, {"dir": "technical-explainer", "text": "---\nname: Technical explainer\ndescription: Explains how a technology, system or method works at the user's chosen level, with a diagram and a worked example.\n---\n\n# Technical explainer\n\n## When to use\nThe user wants to understand how something works, not to decide whether to buy or build it.\n\n## Steps\n1. Say in one sentence what the thing does and why anyone uses it.\n2. Name the main parts and what each one does.\n3. Walk through how it works, step by step, in the order things happen.\n4. Give one worked example with real numbers and units.\n5. State the limits: when it does not work well, and the common mistakes.\n6. Point to what to learn next.\n\n## Output\n- Summary, then the parts, then how it works.\n- One block diagram of the parts and one flow chart of the steps.\n- The worked example in its own section, with the arithmetic shown.\n- A short glossary if more than five technical terms were needed.\n\n## Checks before finishing\n- A reader at the chosen level could explain it back.\n- The worked example can be checked with a calculator.\n- Every formula says what each symbol means and its unit.\n"}, {"dir": "business-idea-presentation", "text": "---\nname: Business idea presentation\ndescription: Researches a business idea and builds a 20-slide pitch presentation that downloads as a PowerPoint file.\noutput: presentation\n---\n\n# Business idea presentation\n\n## When to use\nThe user wants to present a business idea to investors, partners, a bank or a board, and needs slides, not a report.\n\n## Slides, in this order\nEach line gives the slide, its layout, and what it must contain.\n\n1. **Title** (title): the business name or idea in at most 6 words, and a one-line promise.\n2. **Company overview** (panel, with a photo): who we are, what we do, and for whom, in at most 45 words.\n3. **Problem** (text, with a photo): the problem, who has it, and what it costs them. One sourced figure.\n4. **Solution** (steps): three steps or parts that show how the idea solves the problem.\n5. **How it works** (steps): the customer's path from first contact to payment, in 4 or 5 steps.\n6. **Market opportunity** (stats): three or four numbers: market size, growth, and the share within reach. Name the source.\n7. **Target customer** (text, with a photo): the first customers to win, where they are, and how they buy.\n8. **Business model canvas** (grid, 9 boxes): key partners, key activities, key resources, value proposition, customer relationships, channels, customer segments, cost structure, revenue streams.\n9. **Revenue model** (steps): how money comes in, from who pays to how often, in 4 or 5 steps.\n10. **Pricing** (table): products or plans, price, and what is included.\n11. **Competitive landscape** (table): three to five competitors compared on price, strength and weakness.\n12. **Competitive advantage** (panel): the two or three things that are hard to copy.\n13. **Go-to-market** (text): the channels and first 90 days of selling.\n14. **Traction and validation** (stats): what is already proven: customers, pilots, sign-ups, letters of intent. Say plainly if there is none yet.\n15. **Roadmap** (steps): four or five milestones with dates.\n16. **Team** (grid): the people or roles, and what each brings.\n17. **Financial projections** (table): three years of revenue, costs and profit. Mark estimates as estimates.\n18. **Funding and use of funds** (table): the amount sought and what it will be spent on, with percentages.\n19. **Risks** (grid): four to six risks, each with how it is reduced.\n20. **Next steps** (close): the ask, the decision wanted, and contact details.\n\n## Writing rules for slides\n- One idea per slide. A title of at most 6 words that states the point.\n- At most 45 words of body text, or 5 bullets of at most 12 words each.\n- Numbers carry their unit and their source.\n- Money in local currency with US dollars in brackets.\n- Speaker notes for every slide: one to three sentences on what to say.\n- Leave out a slide only if nothing true can be said on it, and say so in the notes of the slide before.\n\n## Look\n- Wide 16:9 slides on a dark background, with a light slide every few slides for contrast.\n- Serif titles, plain sans-serif body, one accent colour, and generous empty space.\n- Photos on overview, problem and customer slides only; diagrams and tables carry the rest.\n\n## Checks before finishing\n- All 20 slides are present and in order.\n- Every figure has a source or is marked as an estimate.\n- The financial table adds up, and the funds table totals 100%.\n"}]};
const libTitle=(text,fallback)=>{const fm=String(text).match(/^---[\s\S]*?\bname:\s*(.+)[\s\S]*?---/),h=String(text).match(/^#\s+(.+)$/m);return ((fm&&fm[1])||(h&&h[1])||fallback||'Untitled').trim()};
const libBody=text=>String(text).replace(/^---[\s\S]*?---\s*/,'');
const libDesc=text=>{const m=String(text).match(/^---[\s\S]*?\bdescription:\s*(.+)[\s\S]*?---/);return m?m[1].trim():''};
function ensureLib(){
  if(!Array.isArray(S.rules))S.rules=LIBSTART.rules.map((r,i)=>({id:'r'+i,file:r.file,text:r.text,on:true,saved:0}));

  LIBSTART.skills.forEach((k,i)=>{if(!S.libSeen.includes('k:'+k.dir)){S.libSeen.push('k:'+k.dir);if(!S.skills.some(x=>x.dir===k.dir))S.skills.push({id:'k'+Date.now()+i,dir:k.dir,text:k.text,on:true,saved:0,dirty:true})}});

}
const rulesText=()=>{const t=S.rules.filter(r=>r.on&&r.text.trim()).map(r=>r.text.trim()).join('\n\n').slice(0,6000);return t?`\n\nHouse rules for documents. Follow them. Where a rule conflicts with the shape asked for in this request, the shape wins.\n<rules>\n${t}\n</rules>`:''};

 ['Find, download, print or share a document','Open the folder, then Open document. From there you can download it for Word, copy the text, print or save as PDF, and share the summary to WhatsApp, X, LinkedIn, Gmail and others.'],
 ['Notes: sections, follow-ups and sharing','In Brain, the Notes tab lists every section of your knowledge base on the left; choose one to show it on the right. In a follow-ups section, Research this sends the question to the chat it belongs to and the answer is added there. Share sends a section to WhatsApp and other apps. The text editor is under Overview and is never shared.'],
 ['Share a chat or a single answer','In a folder, Share chat sends the conversation as text, and the Share button under any answer sends just that answer with its question.'],
 ['My Desktop','My Desktop, in the sidebar, is a single screen that links to everything: six large folders for the main areas, a ring showing tasks closed and research followed, your files by type, every research folder and project as a tile, and your recent files. Search at the top filters folders and files as you type.'],
 ['How much space the app uses','My Desktop has a Memory usage panel: the total size of your data on this device, a bar for each part (documents, conversations, brain, projects and tasks, rules and skills, guides), and how much of the browser\u2019s allowance is used.'],
 ['Where is the camera and voice note screen','Field capture is at the top of Home and near the top of My Desktop, each with four buttons: Photo, Voice note, Web page note and Text note. "Open the field log" shows everything captured, project by project. Every project page has the same buttons in its own Field log.'],
 ['Photos, voice notes and web page notes','Open a project and use the Field log: Photo opens the camera on a phone, Voice note records what you say and types it out where the browser can, Web page note saves a link with the passage and your comment, and Text note is a quick note. Each can be tied to a task. Field capture is also on Home and in the Create menu. With a computer folder connected, photos and recordings are saved in the project\u2019s field-log folder.'],
 ['Switch between chats and projects','Whenever a chat, project or guide is open, a list on the left shows all the others in colour bands: chats you follow, other research chats, projects with their progress, and guides. Click one to switch. On a phone the list is a drop-down at the top.'],
 ['Make a PowerPoint presentation','On Home, choose the skill Business idea presentation, type the idea and press Research. The result is a set of about 20 slides you can page through, with speaker notes. Download PowerPoint gives an editable .pptx file. You can edit the skill under Rules to change the slides it asks for.'],
 ['Rules and skills','Rules, in the sidebar, holds the dos and don\u2019ts that every report and update follows, as plain files you can edit, switch off, add to or reset. Skills are methods for one kind of research, such as a feasibility study or a tender review; choose one in the Skill menu on Home before pressing Research. With a computer folder connected they are saved under rules/ and skills/ and can be edited there too.'],
 ['Follow-up questions on a document','At the bottom of an open document, ask follow-up questions. Press Save and the answers are worked into the document as a new revision, and anything the discussion made irrelevant is removed. Go back to revision returns to the earlier text.'],
 ['Chat about a topic','Open a folder and type in the box at the bottom of the Conversation tab. The assistant knows the report, your brain and your open tasks.'],
 ['Add and move tasks','Press Create, then Task; or use Add task on the Tasks board. Drag a card to another lane on a computer, or open it and change the status on a phone. Tasks can have a project, a due date and notes.'],
 ['Create a project with a timeline','Press Create, then Project. Leave the draft box ticked and OrganizerTX writes the activity plan and Gantt timeline. Tick activities off as you finish them.'],
 ['Dashboard and My Action List','Dashboard shows the headline numbers, overall progress, tasks by status, My Action List with a progress bar per project, upcoming deadlines, every discussion with the date it started, and documents filed over the last 14 days. Tasks keeps the board and list.'],
 ['Guides: best AI businesses and best AI stack','Under Folders, Guides holds two ranked lists built for your country. Open an entry to get its timeline and activity plan, then add it to My Action List.'],
 ['Weekly AI business ideas','At the bottom of Home. The list refreshes once a day at the time set in Settings. Scroll sideways to see all ten, choose one to research it, or email the list.'],
 ['The AI brain and its map','Brain opens as a map: every note, folder, document, project and task is a point, coloured by source and linked to what it relates to. Drag to turn it, scroll to zoom, click a point to read it and see its connections, search at the top, and click a source in the list to hide or show it. The Notes tab shows the same knowledge as text, where you can edit it or press Organise now.'],
 ['Country, currency and explanation level','Set these in Settings. Research uses your country for prices, rules and suppliers, with local currency and US dollars. ELI5 to Expert controls how simply things are explained.'],
 ['Going back to the previous screen','Use the Back button at the top of a screen, or your browser\u2019s or phone\u2019s own Back button. Both return to the screen you were on before.'],
 ['Dark and light theme, and hiding the sidebar','Use the sun or moon icon to switch theme; the choice is remembered. The panel icon next to it hides the sidebar, and the menu button at the top left brings it back.'],
 ['Save folders and documents on my computer','In Settings, under Folders on this computer, choose your organizertx folder once. Every chat then gets its own folder under projects/, named with its code and a brief name such as P005_ai-video-ads, holding each report and update (named by date, time and number), the diagrams and the conversation. This works in Chrome or Edge on a computer.'],
 ['Back up or move my data','Everything is stored on this device only. In Settings, Save a backup creates a file; Restore from backup loads it on another phone or computer.'],
 ['Email and notifications','Add your email address in Settings. Email this list opens a draft in your mail app; automatic emailing needs the organiser\u2019s server. Update notifications can be turned on in Settings.'],
 ['Install on an Android phone','Open the app address in Chrome, tap the three dots, then Install app or Add to Home screen.'],
 ['Something failed or came back empty','Read the message shown; it says why. Check your internet connection and your key or access code in Settings, then try again. A daily limit resets at midnight UTC.']
];
const helpHits=()=>{const q=V.helpQ.trim().toLowerCase().split(/\s+/).filter(Boolean);return HELP.filter(h=>q.every(w=>(h[0]+' '+h[1]).toLowerCase().includes(w)))};
const helpListHtml=()=>{const h=helpHits();return h.length?h.map(x=>`<details class="hq" ${V.helpQ.trim()&&h.length<=3?'open':''}><summary>${esc(x[0])}</summary><p>${esc(x[1])}</p></details>`).join(''):'<p class="muted">No guide matches. Ask the assistant below.</p>'};
function askHelp(){
  const q=($('#helpask')||{}).value;if(!q||!q.trim()||busy)return;
  if(needKey())return;
  V.helpChat.push({role:'user',text:q.trim()});
  job('help','Thinking',async signal=>{
    const hist=V.helpChat.slice(-8).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text}));while(hist.length&&hist[0].role!=='user')hist.shift();
    const r=await callAI({system:`You are the built-in help assistant of OrganizerTX ${VERSION}, an app for research, projects and daily tasks. Answer questions about using the app from the guide below, in a few plain sentences, naming the exact buttons and screens. If the guide does not cover it, say so and give your best general advice. You may also answer short general questions. The user is ${S.profile.name||'the user'}${S.profile.country?' in '+S.profile.country:''}.\n\nGUIDE:\n${HELP.map(h=>'- '+h[0]+': '+h[1]).join('\n')}`,depth:'helper',maxTokens:3000,signal,messages:hist});
    V.helpChat.push({role:'ai',text:r.text.trim()});
  }).then(()=>{const last=V.helpChat[V.helpChat.length-1];if(last&&last.role==='user'){V.helpChat.push({role:'err',text:'The assistant could not answer just now. Try again.'});render()}});
}
function viewHelp(){
  const mine=busy&&busy.topicId==='help';
  return `<div class="page"><div><h1 style="font-size:1.7rem">Help</h1><p class="muted" style="margin:.3em 0 0">Search the guides, or ask the assistant.</p></div>
  <div class="field"><label for="helpq">Search the guides</label><input type="text" id="helpq" value="${esc(V.helpQ)}" placeholder="For example: update, backup, task, share"></div>
  <div class="list" id="helplist">${helpListHtml()}</div>
  <section class="card"><h2 style="font-size:1.15rem">Ask the assistant</h2>
    <div class="thread" style="padding:12px 0 0">${V.helpChat.map(m=>m.role==='user'?`<div class="msg user">${esc(m.text)}</div>`:m.role==='err'?`<div class="msg err">${esc(m.text)}</div>`:`<div class="msg ai" style="background:var(--bg)"><div class="md">${md(m.text)}</div></div>`).join('')}${mine?'<div class="msg ai working" style="background:var(--bg)"><span class="spin"></span>Thinking</div>':''}</div>
    <div class="row" style="align-items:flex-end;margin-top:8px;flex-wrap:nowrap"><textarea id="helpask" rows="1" placeholder="How do I..." aria-label="Question for the assistant"></textarea><button class="btn primary" data-act="help-ask" ${busy?'disabled':''}>Ask</button></div>
    <p class="small muted" style="margin:8px 0 0">The assistant is AI and can be wrong. Each question uses one small request.</p></section></div>`;
}
function readProfileInputs(){
  const n=$('#name');if(n)S.profile.name=n.value.trim();
  const co=$('#country');if(co){const v=co.value.trim(),hit=Object.keys(CURRENCY).find(c=>c.toLowerCase()===v.toLowerCase());S.profile.country=hit||v}
  const tw=$('#town');if(tw)S.profile.town=tw.value.trim();
  const k=$('#key');if(k)S.key=k.value.trim();
  const c=$('#code');if(c)S.code=c.value.trim();
  const em=$('#email');if(em)S.email=em.value.trim();
  const da=$('#dailyat');if(da&&/^\d\d:\d\d$/.test(da.value))S.dailyAt=da.value;
}

  tidy(){tidyBrain()},
  'save-brain'(){S.brain.organized=$('#braintext').value.trim();toast('Brain saved.')},
  async notify(){
    if(S.notify){S.notify=false;return}
    if(!('Notification' in window)){toast('This browser does not support notifications.');return}
    const p=await Notification.requestPermission();S.notify=p==='granted';toast(S.notify?'Notifications are on.':'Notifications were not allowed.');save();render();
  },
  backup(){saveFile(`organizertx-backup-${ymd(Date.now())}.json`,JSON.stringify({...S,key:''},null,1),'application/json')},
  async reset(){if(await confirmBox('Erase every folder, document and the AI brain from this device?','Erase')){S=fresh();seedExample();ensureShape();V={view:'home',topic:null,tab:'chat',doc:null,depth:null,level:null,objList:[],objSel:[],objOpen:false,askPrev:'',helpQ:'',helpChat:[],dq:'',dcat:'all',dmode:'grid',btab:'map',bsec:'all',lib:'',skill:'',guide:null,plan:null,tfilter:'all',tmode:'board',draft:'',ask:''};save();render()}}
};
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-stop]'))return;
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  await fn(el.dataset.v);save();
  if(!['stop','print','dl-doc','copy-doc','save-chat','backup','wk-scroll','sug-scroll','brief-copy','paper-word','paper-copy','fa-copy','meet-dictate','weekly-email','share-kb','share-chat','share-msg','share-doc','deck-dl','cap','cap-menu','log-open'].includes(el.dataset.act))render();
  if(el.dataset.act==='idea'){const a=$('#ask');if(a)a.focus()}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.bind){const path=e.target.dataset.bind.split('.');let o=V;for(let i=0;i<path.length-1;i++)o=o&&o[path[i]];if(o)o[path[path.length-1]]=e.target.value;
    if(e.target.id==='aq'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight+2,160)+'px'}}
  if(e.target.id==='bq'){BM.q=e.target.value;bhits()}
  if(e.target.id==='dq'){V.dq=e.target.value;const b=$('#deskbody');if(b)b.innerHTML=deskBody()}
  if(e.target.id==='libtext'){const pv=$('#libprev');if(pv)pv.innerHTML=md(libBody(e.target.value))}
  if(e.target.id==='docask'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'}
  if(e.target.id==='helpq'){V.helpQ=e.target.value;const l=$('#helplist');if(l)l.innerHTML=helpListHtml()}
  if(e.target.id==='ask'){V.ask=e.target.value;e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight+2,300)+'px'}
  if(e.target.id==='chat'){V.draft=e.target.value;e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.change==='interval'){ACT.follow(e.target.value);save();render()}
  if(e.target.id==='blabels')BM.labels=e.target.checked;
  if(e.target.dataset.change==='bsec'){V.bsec=e.target.value;render()}
  if(e.target.dataset.change==='lib'){V.lib=e.target.value;render()}
  if(e.target.dataset.change==='libon'){const c=libCur();if(c.it){c.it.on=e.target.checked;save();render()}}
  if(e.target.dataset.change==='skill')V.skill=e.target.value;
  if(e.target.dataset.change==='wsgo'){const [a,v]=e.target.value.split('|');if(ACT[a]){ACT[a](v);save();render()}}
  if(e.target.dataset.change==='level')V.level=e.target.value;
  if(e.target.dataset.change==='obj'){const i=+e.target.dataset.i;V.objSel=e.target.checked?[...new Set([...V.objSel,i])].sort((a,b)=>a-b):V.objSel.filter(x=>x!==i);applyObjectives();render()}
  if(e.target.closest('.sett')&&e.target.id!=='restore'){readProfileInputs();save()}
  if(e.target.id==='fafile'){FA_FILES=[...e.target.files].slice(0,2);if(FA_FILES.length>1&&V.fa.task!=='compare'&&V.fa.task!=='ask')V.fa.task='compare';render()}
  if(e.target.dataset.change==='dtype'){V.dcat=e.target.value;V.dtab='files';render()}
  if(e.target.dataset.change==='vatin'){budOf(curPlan()).vatIn=e.target.checked;save();render()}
  if(e.target.dataset.change==='towner'){V.towner=e.target.value;render()}
  if(e.target.dataset.bud){const [i,k]=e.target.dataset.bud.split('|'),l=budOf(curPlan()).lines[+i];if(l){l[k]=k==='planned'||k==='actual'?num(e.target.value):e.target.value.trim();save();setTimeout(()=>{const a=document.activeElement,k2=a&&a.dataset&&a.dataset.bud;render();if(k2){const n=document.querySelector(`[data-bud="${k2}"]`);if(n){n.focus();if(n.select)n.select()}}},0)}}
  if(e.target.dataset.mile){const [i,k]=e.target.dataset.mile.split('|'),m=(curPlan().miles||[])[+i];if(m){m[k]=e.target.value.trim();save();setTimeout(()=>{const a=document.activeElement,k2=a&&a.dataset&&a.dataset.mile;render();if(k2){const n=document.querySelector(`[data-mile="${k2}"]`);if(n)n.focus()}},0)}}
  if(e.target.id==='budfile'||e.target.id==='budcam'){const f=e.target.files[0];e.target.value='';if(f)importBudget(f)}
  if(e.target.dataset.change==='tfilter'){V.tfilter=e.target.value;render()}
  if(e.target.id==='country'){readProfileInputs();save();const h=$('#curhint');if(h)h.textContent=CURRENCY[S.profile.country]||'your local currency'}
  if(e.target.id==='restore'&&e.target.files[0]){
    const f=e.target.files[0],rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.profile||!Array.isArray(d.topics))throw 0;const key=S.key;S=Object.assign(fresh(),d);S.profile=Object.assign(fresh().profile,d.profile);S.key=d.key||key;ensureShape();save();render();toast('Backup restored.')}catch(x){toast('That file is not a OrganizerTX backup.')}};
    rd.readAsText(f);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='docask'){e.preventDefault();docAsk();return}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='helpask'){e.preventDefault();askHelp();return}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chat'){e.preventDefault();ACT.send();save();render()}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='aq'){e.preventDefault();if(!busy){askData(V.as.q);save();render()}}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='ask'){e.preventDefault();ACT.research();render()}
  if(V.doc&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){const t0=topic(),d0=t0&&t0.docs.find(x=>x.ref===V.doc);if(d0&&d0.deck){V.slide=Math.max(0,Math.min(d0.deck.slides.length-1,(V.slide||0)+(e.key==='ArrowRight'?1:-1)));render();return}}
  if(e.key==='Escape'&&V.doc){V.doc=null;render()}
  if(e.key==='Escape'){const m=$('.modal');if(m)m.remove()}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('kcard'))e.target.click();
});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.kcard');if(c){e.dataTransfer.setData('text/plain',c.dataset.v);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const l=e.target.closest&&e.target.closest('.lane');document.querySelectorAll('.lane.over').forEach(x=>{if(x!==l)x.classList.remove('over')});if(l){e.preventDefault();l.classList.add('over')}});
document.addEventListener('drop',e=>{const l=e.target.closest&&e.target.closest('.lane');if(!l)return;e.preventDefault();const t=findTask(e.dataTransfer.getData('text/plain'));if(t){t.a.status=l.dataset.lane;t.a.closed=isDone(t.a)?Date.now():0;save()}render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- start ---------- */
(async function init(){
  await store.open();
  try{const h=await store.key('dir');if(h&&h.queryPermission){DISK.root=h;DISK.ok=(await h.queryPermission({mode:'readwrite'}))==='granted'}}catch(e){}
  if(hosted())await new Promise(ok=>{const sc=document.createElement('script');sc.src='config.js';sc.onload=sc.onerror=ok;document.head.appendChild(sc);setTimeout(ok,2500)});
  SERVER=String(window.ORGANIZERTX_SERVER||window.FUATILIA_SERVER||'').trim();
  const saved=await store.get();
  if(saved&&saved.profile){S=Object.assign(fresh(),saved);S.profile=Object.assign(fresh().profile,saved.profile)}else seedExample();
  ensureShape();S.models=fresh().models;applyTheme();
  render();
  setTimeout(()=>{if(!S.profile.setup||!hosted())render()},1200);   // the preview bridge can arrive after first paint
  setTimeout(tick,3000);setInterval(tick,60000);setTimeout(checkReminders,4000);setInterval(checkReminders,30000);
  if(DISK.root&&DISK.ok)setTimeout(()=>syncDisk(),4000);
  if(hosted()&&'serviceWorker' in navigator&&location.protocol==='https:'){setTimeout(()=>{if(hosted())navigator.serviceWorker.register('sw.js').catch(()=>{})},1500)}
})();
</script>
</body>
